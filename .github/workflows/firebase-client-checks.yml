name: APEX Firebase Client Checks

on:
  pull_request:
    paths:
      - "firebase/**"
      - "functions/**"
      - "index.html"
      - "docs/FIREBASE_NATIVE_IMPLEMENTATION_AR.md"
      - "docs/FIREBASE_DEPLOYMENT_AR.md"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-client-checks.yml"
  push:
    branches: [firebase-native-foundation]
    paths:
      - "firebase/**"
      - "functions/**"
      - "index.html"
      - "docs/FIREBASE_NATIVE_IMPLEMENTATION_AR.md"
      - "docs/FIREBASE_DEPLOYMENT_AR.md"
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - ".github/workflows/firebase-client-checks.yml"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Check Firebase client modules and config
        run: |
          node --check firebase/client.js
          node --check firebase/compat.js
          node --check firebase/auth.js
          node --check firebase/data.js
          node --check firebase/runtime-config.example.js
          node --check firebase/otp.js
          cd functions && npm install --ignore-scripts && npm run check && cd ..
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');const match=html.match(/<script type=\"module\">([\\s\\S]*?)<\\/script>/);if(!match)throw new Error('Storefront module script not found');fs.writeFileSync('/tmp/apex-storefront-module.mjs',match[1]);"
          node --check /tmp/apex-storefront-module.mjs
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8'))"
      - name: Validate Firestore and Storage rules with emulators
        run: |
          npm install --global firebase-tools
          firebase emulators:exec --project apex-3c12f-ci --only auth,functions,firestore,storage "echo Firebase rules loaded"
