name: Build standalone APEX Android APK

on:
  push:
    branches:
      - release/android-standalone-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare storefront assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html admin.html privacy.html android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/admin.html
          test -s android/app/src/main/assets/privacy.html
      - name: Build APK
        run: gradle --no-daemon -p android assembleRelease
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "package: name='com.apex.store'|application-label:'APEX'"
      - uses: actions/upload-artifact@v4
        with:
          name: APEX-Standalone-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
