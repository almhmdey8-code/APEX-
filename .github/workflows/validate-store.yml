name: Validate APEX storefront
on:
  push:
    branches:
      - main
      - hardening/pre-release-2026-11-05
      - fix/apex-store-ui-audit
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate storefront integration
        run: node scripts/validate-store.mjs
      - name: Check storefront and admin JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script\b(?=[^>]*\btype\s*=\s*["']module["'])[^>]*>([\s\S]*?)<\/script\s*>/gi)];
            const inlineBlocks = blocks.filter(match => {
              const openingTag = match[0].slice(0, match[0].indexOf('>') + 1);
              return !/\bsrc\s*=/.test(openingTag) && match[1].trim();
            });
            inlineBlocks.forEach((match, index) => {
              fs.writeFileSync('/tmp/' + file.replace('.html', '') + '-' + index + '.mjs', match[1]);
            });
          }
          NODE
          for file in /tmp/index-*.mjs /tmp/admin-*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
