name: Validate APEX storefront
on:
  push:
    branches:
      - main
      - fix/apex-store-ui-audit
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check storefront and admin scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const blocks = [...html.matchAll(/<script\b(?=[^>]*\btype\s*=\s*["']module["'])[^>]*>([\s\S]*?)<\/script\s*>/gi)];
            if (!blocks.length) throw new Error('Module script missing in ' + file);
            const inlineBlocks = blocks.filter(match => !/\bsrc\s*=/.test(match[0]) && match[1].trim());
            if (!inlineBlocks.length) throw new Error('No inline module script found in ' + file);
            const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(x => x[1]);
            const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (duplicates.length) throw new Error(file + ' duplicate IDs: ' + [...new Set(duplicates)].join(', '));
            inlineBlocks.forEach((match, index) => {
              fs.writeFileSync('/tmp/' + file.replace('.html', '') + '-' + index + '.mjs', match[1]);
            });
          }
          NODE
          for file in /tmp/index-*.mjs /tmp/admin-*.mjs; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
