name: Validate APEX storefront
on:
  push:
    branches:
      - fix/apex-store-ui-audit
  pull_request:
    branches:
      - main
jobs:
  syntax-and-markup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check storefront and admin scripts
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['index.html', 'admin.html']) {
            const html = fs.readFileSync(file, 'utf8');
            const match = html.match(/<script type="module">([\s\S]*?)<\/script>/);
            if (!match) throw new Error('Module script missing in ' + file);
            const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(x => x[1]);
            const duplicates = ids.filter((id, i) => ids.indexOf(id) !== i);
            if (duplicates.length) throw new Error(file + ' duplicate IDs: ' + [...new Set(duplicates)].join(', '));
            fs.writeFileSync('/tmp/' + file.replace('.html', '.mjs'), match[1]);
          }
          NODE
          node --check /tmp/index.mjs
          node --check /tmp/admin.mjs
