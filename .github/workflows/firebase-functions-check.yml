name: Firebase Functions Bridge Checks

on:
  push:
    branches: [firebase-migration-prep]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-check.yml"
  pull_request:
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/firebase-functions-check.yml"

permissions:
  contents: read

jobs:
  functions-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Syntax check
        working-directory: functions
        run: npm run check
      - name: Unit tests
        working-directory: functions
        run: npm test
