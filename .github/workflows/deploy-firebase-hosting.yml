name: Deploy APEX storefront to Firebase Hosting

on:
  push:
    branches: [firebase-native-foundation]
    paths:
      - "index.html"
      - "admin.html"
      - "firebase/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase-hosting.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate storefront modules
        run: |
          node --check firebase/client.js
          node --check firebase/auth.js
          node --check firebase/data.js
          node --check firebase/compat.js
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8'))"
      - name: Deploy live storefront
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: apex-3c12f
          channelId: live
